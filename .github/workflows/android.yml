name: Android build and first test release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install fixed SDK tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: HID, German keyboard and motion checks
        run: python3 tools/check-core.py
      - name: Build current source
        run: python3 tools/build.py
      - name: Verify signed release and fresh payload
        run: python3 tools/verify-release.py --compare-unsigned build/AirPit-v0.0.1-unsigned.apk
      - name: Verify Android signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose releases/AirPit-v0.0.1.apk"

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish signed first test version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.0.1 releases/AirPit-v0.0.1.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'AirPit 0.0.1 · erster Gerätetest' --prerelease \
              --notes-file docs/releases/0.0.1.md
          fi
